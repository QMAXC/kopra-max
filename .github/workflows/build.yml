name: Build

# Bei jedem Push: Tests, Windows-Build (.exe als ZIP), Screenshots.
# Auf main zusätzlich: neues Release mit der ZIP-Datei und aktualisierte Screenshots im README.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: dotnet test
        run: dotnet test tests/KobraMax.Tests -c Release --logger "console;verbosity=normal"

  build:
    name: Windows-Build
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Tests (auch unter Windows)
        run: dotnet test tests/KobraMax.Tests -c Release

      - name: App veröffentlichen (self-contained, unpackaged)
        run: dotnet publish src/KobraMax.App/KobraMax.App.csproj -c Release -o out/KobraMax

      - name: Anleitung und Testdateien beilegen
        shell: pwsh
        run: |
          Copy-Item ANLEITUNG.md out/KobraMax/
          New-Item -ItemType Directory -Force out/KobraMax/Testdateien | Out-Null
          python tools/testdatei_generator.py out/KobraMax/Testdateien
          Get-ChildItem out/KobraMax/Testdateien

      - name: ZIP erstellen
        shell: pwsh
        run: |
          Compress-Archive -Path out/KobraMax -DestinationPath KobraMax-win-x64.zip
          "{0:N1} MB" -f ((Get-Item KobraMax-win-x64.zip).Length / 1MB)

      - uses: actions/upload-artifact@v6
        with:
          name: KobraMax-win-x64
          path: KobraMax-win-x64.zip
          if-no-files-found: error

  screenshots:
    name: Screenshots (Demo-Modus)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          name: KobraMax-win-x64

      - name: App im Demo-Modus starten und fotografieren
        shell: pwsh
        run: |
          Expand-Archive KobraMax-win-x64.zip -DestinationPath app
          $exe = Resolve-Path app/KobraMax/KobraMax.exe
          New-Item -ItemType Directory -Force shots | Out-Null
          foreach ($theme in 'light', 'dark') {
            $png = Join-Path $PWD "shots/app-$theme.png"
            $p = Start-Process -FilePath $exe -ArgumentList "--screenshot=`"$png`"", "--theme=$theme" -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Zeitüberschreitung ($theme)" }
            if (-not (Test-Path $png)) {
              Get-Content app/KobraMax/KobraMax-Fehler.log -ErrorAction SilentlyContinue
              throw "Kein Screenshot ($theme), Exitcode $($p.ExitCode)"
            }
            "{0}: {1:N0} KB" -f $theme, ((Get-Item $png).Length / 1KB)
          }

      - uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: shots/*.png

      - name: Screenshots ins Repo übernehmen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/screenshots | Out-Null
          Copy-Item shots/*.png docs/screenshots/ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Screenshots aktualisieren [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          } else {
            "Keine Änderung an den Screenshots."
          }

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: KobraMax-win-x64

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" KobraMax-win-x64.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Kobra Max Steuerung $tag" \
            --latest \
            --notes "Automatisch gebaut aus ${{ github.sha }}.

          **Download:** \`KobraMax-win-x64.zip\` herunterladen, nach \`H:\\3d druk\\KobraMax\\\` entpacken, \`KobraMax.exe\` doppelklicken.
          Keine Installation und keine Admin-Rechte nötig. Anleitung: ANLEITUNG.md im ZIP."
