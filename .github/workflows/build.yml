name: Build

# Bei jedem Push: Tests, Windows-Build (.exe als ZIP), Screenshots.
# Auf main zusätzlich: neues Release mit der ZIP-Datei und aktualisierte Screenshots im README.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: dotnet test
        run: dotnet test tests/KobraMax.Tests -c Release --logger "console;verbosity=normal"

  build:
    name: Windows-Build
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Tests (auch unter Windows)
        run: dotnet test tests/KobraMax.Tests -c Release

      - name: App veröffentlichen (self-contained, unpackaged)
        run: dotnet publish src/KobraMax.App/KobraMax.App.csproj -c Release -o out/KobraMax

      - name: Anleitung und Testdateien beilegen
        shell: pwsh
        run: |
          Copy-Item ANLEITUNG.md out/KobraMax/
          New-Item -ItemType Directory -Force out/KobraMax/Testdateien | Out-Null
          python tools/testdatei_generator.py out/KobraMax/Testdateien
          Get-ChildItem out/KobraMax/Testdateien

      - name: ZIP erstellen
        shell: pwsh
        run: |
          Compress-Archive -Path out/KobraMax -DestinationPath KobraMax-win-x64.zip
          "{0:N1} MB" -f ((Get-Item KobraMax-win-x64.zip).Length / 1MB)

      - uses: actions/upload-artifact@v6
        with:
          name: KobraMax-win-x64
          path: KobraMax-win-x64.zip
          if-no-files-found: error

  screenshots:
    name: Screenshots (Demo-Modus)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          name: KobraMax-win-x64

      - name: App im Demo-Modus starten und fotografieren
        shell: pwsh
        run: |
          Expand-Archive KobraMax-win-x64.zip -DestinationPath app
          $exe = Resolve-Path app/KobraMax/KobraMax.exe
          New-Item -ItemType Directory -Force shots, diag | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Desktop($pfad) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($pfad); $g.Dispose(); $bmp.Dispose()
          }
          "Bildschirm: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $fehler = $false
          foreach ($theme in 'light', 'dark') {
            $png = Join-Path $PWD "shots/app-$theme.png"
            $p = Start-Process -FilePath $exe -ArgumentList "--screenshot=`"$png`"", "--theme=$theme" -PassThru
            Start-Sleep -Seconds 6
            Save-Desktop (Join-Path $PWD "diag/desktop-$theme.png")
            if (-not $p.WaitForExit(60000)) { $p.Kill(); "Zeitüberschreitung ($theme)"; $fehler = $true }
            elseif (-not (Test-Path $png)) { "Kein Screenshot ($theme), Exitcode $($p.ExitCode)"; $fehler = $true }
            else { "{0}: {1:N0} KB" -f $theme, ((Get-Item $png).Length / 1KB) }
          }
          "--- trace ---"; Get-Content app/KobraMax/KobraMax-trace.log -ErrorAction SilentlyContinue
          "--- fehler ---"; Get-Content app/KobraMax/KobraMax-Fehler.log -ErrorAction SilentlyContinue
          if ($fehler) {
            "--- Ereignisanzeige ---"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
              Where-Object { $_.LevelDisplayName -in 'Error', 'Fehler', 'Warning' } | Select-Object -First 10 |
              ForEach-Object { "[$($_.ProviderName)] $($_.Message)" }
            exit 1
          }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diagnose
          path: diag/*.png

      - uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: shots/*.png

      - name: Screenshots ins Repo übernehmen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/screenshots | Out-Null
          Copy-Item shots/*.png docs/screenshots/ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Screenshots aktualisieren [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          } else {
            "Keine Änderung an den Screenshots."
          }

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: KobraMax-win-x64

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" KobraMax-win-x64.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Kobra Max Steuerung $tag" \
            --latest \
            --notes "Automatisch gebaut aus ${{ github.sha }}.

          **Download:** \`KobraMax-win-x64.zip\` herunterladen, nach \`H:\\3d druk\\KobraMax\\\` entpacken, \`KobraMax.exe\` doppelklicken.
          Keine Installation und keine Admin-Rechte nötig. Anleitung: ANLEITUNG.md im ZIP."

  install-test:
    name: Installations-Befehl testen
    runs-on: windows-latest
    needs: release
    steps:
      - uses: actions/checkout@v6

      - name: "Laufwerk H: wie auf dem Schul-PC simulieren"
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\hlaufwerk"
          subst H: "%RUNNER_TEMP%\hlaufwerk"

      - name: Befehl aus dem README in CMD ausführen
        shell: cmd
        run: |
          mkdir "H:\3d druk" 2>nul & curl -fL -o "%RUNNER_TEMP%\KobraMax.zip" https://github.com/QMAXC/kopra-max/releases/latest/download/KobraMax-win-x64.zip && tar -xf "%RUNNER_TEMP%\KobraMax.zip" -C "H:\3d druk" && start "" "H:\3d druk\KobraMax\KobraMax.exe"

      - name: Ergebnis prüfen (App läuft, Desktop-Verknüpfung da)
        shell: pwsh
        run: |
          if (-not (Test-Path 'H:\3d druk\KobraMax\KobraMax.exe')) { throw 'KobraMax.exe fehlt' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Kobra Max Steuerung.lnk'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $lnk); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $lnk)) { throw 'Desktop-Verknüpfung fehlt' }
          $ziel = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          "Verknüpfung zeigt auf: $ziel"
          if ($ziel -notlike '*KobraMax.exe') { throw 'Verknüpfung zeigt auf das falsche Ziel' }
          # Prozesse eines Schritts beendet der Runner am Schrittende – daher hier per Verknüpfung neu starten.
          Get-Process -Name KobraMax -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process -FilePath $lnk
          Start-Sleep -Seconds 8
          $p = Get-Process -Name KobraMax -ErrorAction SilentlyContinue
          Get-Content 'H:\3d druk\KobraMax\KobraMax-Fehler.log' -ErrorAction SilentlyContinue
          if (-not $p) { throw 'App startet über die Verknüpfung nicht' }
          "App läuft über die Verknüpfung (PID $($p.Id))"
          $p | Stop-Process -Force

      - name: install.cmd testen
        shell: cmd
        run: call install.cmd "%RUNNER_TEMP%\zweiter-ordner" && if not exist "%RUNNER_TEMP%\zweiter-ordner\KobraMax\KobraMax.exe" exit /b 1
